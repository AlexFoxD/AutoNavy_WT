name: Validate Windows standalone
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install local build dependencies
        shell: powershell
        run: ./scripts/install.ps1 -Mode Build
      - name: Compile and stage
        shell: powershell
        run: ./scripts/build.ps1
      - name: Device-free compiled checks from unrelated directory
        shell: powershell
        run: |
          $Exe = Join-Path $PWD '.output/AutoNavy_WT-release-stage/AutoNavy_WT.exe'
          Set-Location $env:TEMP
          & $Exe --check-config --config configs/default.toml
          if ($LASTEXITCODE -ne 0) { throw 'Compiled config failed' }
          & $Exe --dry-run --capture replay --fixture fixtures/smoke --max-frames 3
          if ($LASTEXITCODE -ne 0) { throw 'Compiled replay failed' }
          & $Exe --offline-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Compiled child/resource smoke failed' }
      # Validation only: no release publication or automatic artifact upload.
