name: Build Windows executable

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install build dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-build.txt
          .venv\Scripts\python.exe scripts\check_environment.py --installation-only

      - name: Build and package standalone application
        shell: powershell
        run: .\scripts\build.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoNavy_WT-win64
          path: .output\AutoNavy_WT-win64.zip
          if-no-files-found: error

      - name: Upload to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" .output\AutoNavy_WT-win64.zip --clobber
